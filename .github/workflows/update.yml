name: Update Data Silsilah

on:
  schedule:
    - cron: '0 0 * * *' # Jalan tiap jam 00:00 UTC (07:00 WIB)
  workflow_dispatch: # Tombol update manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Jalankan Script Python
        run: python app.py

      - name: Commit dan Push Perubahan
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add data_keluarga.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update data keluarga dari GSheet"
          git push
